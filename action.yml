name: 'agent-estimate'
description: |-
  Run AI agent effort estimation in CI — PERT + METR + wave planning.

  Forecast contract: TaskSpec holds task facts; ExecutionProfile describes execution;
  AdmissionEnvelope carries caps; ForecastRecord records expected wall forecasts.
  This Action accepts GitHub issue input, with no spec or token-prior input.
  The CLI accepts versioned requests: from the repository root with the matching
  package installed, run agent-estimate estimate --spec examples/estimate-request.yaml --format json.
  Contract, expected-versus-cap scoring, token honesty labels and caller-only priors:
  https://github.com/kiloloop/agent-estimate#v08-forecast-contract

  Comment updates match bot-authored markers. Use github.token or a GitHub App
  installation token; PAT-authored comments are never adopted. Repeated PAT runs
  create new comments when no matching bot-authored comment exists.
author: 'Kiloloop'

branding:
  icon: 'clock'
  color: 'blue'

inputs:
  issues:
    description: 'GitHub issue numbers (comma-separated, e.g. "1,2,3")'
    required: true
  repo:
    description: 'GitHub repo to fetch issues from (owner/name). Comment output modes always post to the triggering PR/issue in the current repo, regardless of this input.'
    required: false
    default: ${{ github.repository }}
  format:
    description: 'Output format: markdown or json'
    required: false
    default: 'markdown'
  output-mode:
    description: |-
      Where to send the report: summary, pr-comment, issue-comment, step-output — or a +-joined combo (e.g. summary+pr-comment).

      Permissions by mode:
      | Mode | Required permissions |
      | --- | --- |
      | summary | issues: read for private-repo issue input |
      | pr-comment | issues: read for private-repo issue input, plus pull-requests: write |
      | issue-comment | issues: write |
      | step-output | issues: read for private-repo issue input |

      contents: read is needed only when the calling workflow checks out its repository.
    required: false
    default: 'summary'
  config:
    description: 'Path to agent config YAML'
    required: false
  title:
    description: 'Report title'
    required: false
    default: 'Agent Estimate Report'
  review-mode:
    description: 'Review overhead tier: none, standard, complex, 3-round'
    required: false
    default: 'standard'
  spec-clarity:
    description: 'Spec clarity modifier (0.3-1.3; lower = clearer)'
    required: false
    default: '1.0'
  warm-context:
    description: 'Warm context modifier (0.3-1.15; lower = warmer)'
    required: false
    default: '1.0'
  agent-fit:
    description: 'Agent fit modifier (0.9-1.2; lower = better fit)'
    required: false
    default: '1.0'
  task-type:
    description: 'Task category: coding, brainstorm, research, config, documentation, frontend, app_dev'
    required: false
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  version:
    description: 'agent-estimate version to install (e.g. "0.9.0"). Omit to install from this Action ref.'
    required: false
  token:
    description: 'GitHub token for issue fetching and comment output. Use github.token or an App installation token for update-in-place comments; PAT-authored comments are never adopted, so repeated PAT runs create new comments when no matching bot comment exists.'
    required: false
    default: ${{ github.token }}

outputs:
  report:
    description: 'Full estimation report content'
    value: ${{ steps.estimate.outputs.report }}
  expected-minutes:
    description: 'Expected minutes (available when format is json)'
    value: ${{ steps.extract.outputs.expected-minutes }}
  package-version:
    description: 'Resolved agent-estimate package version used by this run'
    value: ${{ steps.install.outputs.package-version }}
  install-source:
    description: 'Package install source: action-path or version-override'
    value: ${{ steps.install.outputs.install-source }}

runs:
  using: 'composite'
  steps:
    - name: Validate output-mode
      shell: bash
      env:
        AE_OUTPUT_MODE: ${{ inputs.output-mode }}
      run: |
        # Whole-grammar check: one or more valid tokens joined by single '+' —
        # rejects empty values, leading/trailing/doubled '+', and unknown tokens
        valid='^(summary|pr-comment|issue-comment|step-output)(\+(summary|pr-comment|issue-comment|step-output))*$'
        if ! [[ "$AE_OUTPUT_MODE" =~ $valid ]]; then
          echo "::error::Invalid output-mode '${AE_OUTPUT_MODE}' (valid: summary, pr-comment, issue-comment, step-output, or +-joined combos)"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agent-estimate
      id: install
      shell: bash
      env:
        AE_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$AE_VERSION" ]; then
          install_source="version-override"
          python -m pip install "agent-estimate==${AE_VERSION}"
        else
          install_source="action-path"
          python -m pip install "$GITHUB_ACTION_PATH"
        fi

        package_version=$(python -c "from importlib.metadata import version; print(version('agent-estimate'))")
        {
          printf 'package-version=%s\n' "$package_version"
          printf 'install-source=%s\n' "$install_source"
        } >> "$GITHUB_OUTPUT"
        echo "Installed agent-estimate ${package_version} from ${install_source}"

    - name: Run estimation
      id: estimate
      shell: bash
      env:
        AE_ISSUES: ${{ inputs.issues }}
        AE_REPO: ${{ inputs.repo }}
        AE_FORMAT: ${{ inputs.format }}
        AE_CONFIG: ${{ inputs.config }}
        AE_TITLE: ${{ inputs.title }}
        AE_REVIEW_MODE: ${{ inputs.review-mode }}
        AE_SPEC_CLARITY: ${{ inputs.spec-clarity }}
        AE_WARM_CONTEXT: ${{ inputs.warm-context }}
        AE_AGENT_FIT: ${{ inputs.agent-fit }}
        AE_TASK_TYPE: ${{ inputs.task-type }}
        AE_OUTPUT_MODE: ${{ inputs.output-mode }}
        AE_PACKAGE_VERSION: ${{ steps.install.outputs.package-version }}
        AE_INSTALL_SOURCE: ${{ steps.install.outputs.install-source }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        args=("--issues" "$AE_ISSUES" "--repo" "$AE_REPO" "--format" "$AE_FORMAT")
        args+=("--title" "$AE_TITLE" "--review-mode" "$AE_REVIEW_MODE")
        args+=("--spec-clarity" "$AE_SPEC_CLARITY" "--warm-context" "$AE_WARM_CONTEXT")
        args+=("--agent-fit" "$AE_AGENT_FIT")

        if [ -n "$AE_CONFIG" ]; then
          args+=("--config" "$AE_CONFIG")
        fi

        if [ -n "$AE_TASK_TYPE" ]; then
          args+=("--type" "$AE_TASK_TYPE")
        fi

        issue_selection="${AE_ISSUES//,/ }"
        read -r -a selected_issues <<< "$issue_selection"
        if [[ "$AE_OUTPUT_MODE" == *"issue-comment"* ]] && [ "${#selected_issues[@]}" -eq 1 ]; then
          args+=("--compact")
        fi

        output=$(agent-estimate estimate "${args[@]}")

        if [ "$AE_FORMAT" = "markdown" ]; then
          output+=$'\n\n---\n'
          output+="_Install provenance: \`agent-estimate ${AE_PACKAGE_VERSION}\` via \`${AE_INSTALL_SOURCE}\`._"
        fi

        printf '%s' "$output" \
          | bash "$GITHUB_ACTION_PATH/scripts/write_github_output.sh" report

    - name: Extract expected minutes
      id: extract
      if: ${{ inputs.format == 'json' }}
      shell: bash
      env:
        AE_REPORT: ${{ steps.estimate.outputs.report }}
      run: |
        minutes=$(echo "$AE_REPORT" | python -c "import sys,json; print(json.load(sys.stdin)['timeline']['expected_case_minutes'])" 2>/dev/null || echo "")
        printf 'expected-minutes=%s\n' "$minutes" >> "$GITHUB_OUTPUT"

    - name: Truncate report for comments
      id: truncate
      if: contains(inputs.output-mode, 'pr-comment') || contains(inputs.output-mode, 'issue-comment')
      shell: bash
      env:
        AE_REPORT: ${{ steps.estimate.outputs.report }}
      run: |
        # GitHub comment bodies cap at 65536 chars — truncate once at 60KB for all
        # comment steps, without splitting a multi-byte UTF-8 character at the boundary
        body="$(
          printf '%s' "$AE_REPORT" \
            | python -c "import sys; d=sys.stdin.buffer.read()[:61440]; sys.stdout.buffer.write(d.decode('utf-8', 'ignore').encode())"
        )"
        printf '%s' "$body" \
          | bash "$GITHUB_ACTION_PATH/scripts/write_github_output.sh" body

    - name: Write job summary
      if: contains(inputs.output-mode, 'summary')
      shell: bash
      env:
        AE_REPORT: ${{ steps.estimate.outputs.report }}
      run: |
        printf '%s\n' "$AE_REPORT" >> "$GITHUB_STEP_SUMMARY"

    - name: Post PR comment
      if: contains(inputs.output-mode, 'pr-comment')
      shell: bash
      env:
        AE_BODY: ${{ steps.truncate.outputs.body }}
        GH_TOKEN: ${{ inputs.token }}
        GH_EVENT: ${{ github.event_name }}
        GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_REPO: ${{ github.repository }}
      run: |
        if [ "$GH_EVENT" != "pull_request" ] && [ "$GH_EVENT" != "pull_request_target" ]; then
          echo "::warning::output-mode includes pr-comment but event is '${GH_EVENT}', not a pull request. Skipping."
          exit 0
        fi

        printf '%s' "$AE_BODY" \
          | bash "$GITHUB_ACTION_PATH/scripts/upsert_action_comment.sh" \
              pr "$GH_PR_NUMBER" "$GH_REPO"

    - name: Post issue comment
      if: contains(inputs.output-mode, 'issue-comment')
      shell: bash
      env:
        AE_BODY: ${{ steps.truncate.outputs.body }}
        GH_TOKEN: ${{ inputs.token }}
        GH_EVENT: ${{ github.event_name }}
        GH_ISSUE_NUMBER: ${{ github.event.issue.number }}
        GH_ISSUE_IS_PR: ${{ github.event.issue.pull_request.url }}
        GH_REPO: ${{ github.repository }}
      run: |
        if [ "$GH_EVENT" != "issues" ] && [ "$GH_EVENT" != "issue_comment" ]; then
          echo "::warning::output-mode includes issue-comment but event is '${GH_EVENT}', not an issue event. Skipping."
          exit 0
        fi

        # issue_comment also fires for comments on PRs (PRs are issues in the API) —
        # those belong to pr-comment mode, and posting there needs pull-requests: write
        if [ -n "$GH_ISSUE_IS_PR" ]; then
          echo "::warning::issue-comment mode: the triggering comment is on a pull request, not an issue. Skipping (use pr-comment mode for PRs)."
          exit 0
        fi

        printf '%s' "$AE_BODY" \
          | bash "$GITHUB_ACTION_PATH/scripts/upsert_action_comment.sh" \
              issue "$GH_ISSUE_NUMBER" "$GH_REPO"
