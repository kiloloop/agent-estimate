name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run preflight (full)
        run: make preflight ARGS="--full"

  # A dev-only corpus is kept out of two independent carriers: hatchling's sdist
  # exclude, and `export-ignore` for the public `git archive` export. Config alone
  # proves neither carrier honours it, nor that what still ships is internally
  # consistent — an artifact carrying a test but not its fixture fails on arrival
  # (PR #80 F-001 for the sdist, F-003 for the archive). Both are built and run.
  export-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the sdist
        run: |
          pip install build==1.6.1
          python -m build --sdist --outdir dist
      - name: Extract it
        run: |
          mkdir -p extracted
          tar -xzf dist/*.tar.gz -C extracted --strip-components=1
      - name: Dev-only paths must be absent from the artifact
        run: |
          cd extracted
          status=0
          for path in \
            tests/fixtures/github_issue_mode_regressions.json \
            tests/unit/test_issue_mode_regressions.py \
            tests/unit/test_packaging.py
          do
            if [ -e "$path" ]; then
              echo "::error::$path shipped in the sdist but is dev-only"
              status=1
            fi
          done
          exit $status
      - name: Every test the sdist ships must pass from inside it
        run: |
          cd extracted
          pip install -e .[dev]
          python -m pytest tests/ -q

      - name: Export the public archive
        run: |
          mkdir -p exported
          git archive --format=tar HEAD | tar -x -C exported
      - name: Dev-only paths must be absent from the public export
        run: |
          cd exported
          status=0
          for path in \
            tests/fixtures/github_issue_mode_regressions.json \
            tests/unit/test_issue_mode_regressions.py \
            tests/unit/test_packaging.py
          do
            if [ -e "$path" ]; then
              echo "::error::$path is in the public export but is dev-only"
              status=1
            fi
          done
          exit $status
      - name: Workflows in the public export must only import modules it ships
        run: |
          cd exported
          status=0
          # A workflow naming an export-ignore'd module passes here and fails only
          # after promotion, where the module is absent. Resolve every module an
          # exported workflow imports against the export itself.
          for mod in $(grep -rhoE 'import agent_estimate[A-Za-z0-9_.]*' .github/workflows/ \
                       | sed 's/^import //' | sort -u); do
            rel=$(echo "$mod" | tr '.' '/')
            if [ ! -e "src/${rel}.py" ] && [ ! -e "src/${rel}/__init__.py" ]; then
              echo "::error::exported workflows import ${mod}, which the public export does not ship"
              status=1
            fi
          done
          exit $status
      - name: Every test the public export ships must pass from inside it
        run: |
          cd exported
          pip install -e .[dev]
          python -m pytest tests/ -q

  # CI's fresh installs resolve the newest allowed dependencies, so declared
  # FLOORS are never exercised — a typer floor too low for PEP 604 CLI
  # annotations shipped green until reviewed at the floor (PR #61 F-001).
  test-min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install at declared dependency floors
        run: |
          # Click 8.2 exercises the compatibility boundary and the
          # no_args_is_help fix that establishes the Typer floor.
          pip install typer==0.16.1 click==8.2.0 pyyaml==6.0.1 pydantic==2.5.0 networkx==3.0 typing-extensions==4.6.1
          pip install --no-deps -e .
      - name: CLI constructs and answers at the floors
        run: |
          agent-estimate --help
          agent-estimate --version
      - name: Import and test the package at the floors
        run: |
          pip install 'pytest>=9.0.3,<10.0' 'tomli>=2.0'
          # Import a module that SHIPS: tracing/ is export-ignore'd, so naming it
          # here passes upstream and fails in the public repo, where it is absent.
          # contract.schema exercises the same Pydantic floor (AwareDatetime,
          # StringConstraints, AfterValidator); trace schemas keep their own test,
          # which the pytest run below picks up wherever the module exists.
          python -c "import agent_estimate.contract.schema"
          python -m pytest tests/unit/ -x -q
